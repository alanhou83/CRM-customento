<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡片预览</title>
<style>
  body{font-family:-apple-system,sans-serif;background:#1a1c2e;color:#e0e0e0;margin:0;padding:16px}
  h3{font-size:12px;color:#6b72c3;text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px}
  .card{background:#242640;border-bottom:1px solid rgba(255,255,255,0.08)}
  .card-inner{padding:9px 14px}
  .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .alias{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .amount-usd{font-size:14px;font-weight:700;color:#3ecf8e;flex-shrink:0}
  .amount-cny{font-size:14px;font-weight:700;color:#f7d44f;flex-shrink:0}
  .detail{font-size:11px;color:#9599b3;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cur-usd{background:rgba(79,142,247,.18);color:#4f8ef7;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:600}
  .cur-cny{background:rgba(247,212,79,.18);color:#f7d44f;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:600}
</style>
</head><body>

<h3>新版2行卡片预览</h3>

<div style="background:#242640;border-radius:10px;overflow:hidden;max-width:390px">

  <div class="card"><div class="card-inner">
    <div class="row1">
      <div class="alias">GKK 🍰</div>
      <div class="amount-usd">$8,000</div>
    </div>
    <div class="detail"><span class="cur-usd">USD</span> MDF冰箱贴 · 2026-05-02 · Q2 · Alan · Q2复单</div>
  </div></div>

  <div class="card"><div class="card-inner">
    <div class="row1">
      <div class="alias">HZFS 🛒</div>
      <div class="amount-cny">¥12,000</div>
    </div>
    <div class="detail"><span class="cur-cny">CNY</span> T恤 · 2026-04-05 · Q2 · Mille · DTF订单</div>
  </div></div>

  <div class="card"><div class="card-inner">
    <div class="row1">
      <div class="alias">GKK 🍰</div>
      <div class="amount-usd">$7,500</div>
    </div>
    <div class="detail"><span class="cur-usd">USD</span> MDF冰箱贴 · 2026-03-10 · Q1 · Alan</div>
  </div></div>

  <div class="card"><div class="card-inner">
    <div class="row1">
      <div class="alias">CAZL 🎯</div>
      <div class="amount-usd">$3,200</div>
    </div>
    <div class="detail"><span class="cur-usd">USD</span> MDF杯垫 · 2026-02-20 · Q1 · Kelly · 第二次复单</div>
  </div></div>

  <div class="card"><div class="card-inner">
    <div class="row1">
      <div class="alias">GKK 🍰</div>
      <div class="amount-usd">$5,000</div>
    </div>
    <div class="detail"><span class="cur-usd">USD</span> MDF冰箱贴 · 2026-01-15 · Q1 · Alan · Q1复单</div>
  </div></div>

</div>

</body></html>
