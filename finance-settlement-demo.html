<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>应收应付汇总 · 演示</title>
<style>
:root{--bg:#0f1117;--surface:#191d29;--surface2:#222738;--border:#30364c;--text:#e4e7f1;--muted:#858ea8;--blue:#4f8ef7;--green:#3ecf8e;--red:#f06d79;--yellow:#f7d44f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.notice{font-size:11px;color:#d8b477;margin-bottom:16px;line-height:1.6}.explain{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.6}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.stat{background:var(--surface2);border-radius:8px;padding:15px 17px}.stat label{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}.stat b{font-size:23px}.stat small{display:block;font-size:11px;color:var(--muted);margin-top:7px}
.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}.blue{color:var(--blue)}
.summary-table{border:1px solid var(--border);border-radius:8px;background:var(--surface);overflow:hidden}.summary-header,.party-summary{display:grid;grid-template-columns:minmax(0,1fr) auto 18px;gap:12px;align-items:center}.summary-header{background:var(--surface2);padding:10px 15px;font-size:11px;color:var(--muted)}.summary-header span:not(:first-child){text-align:right}
.party{border-bottom:1px solid var(--border)}.party:last-child{border-bottom:0}.party-summary{list-style:none;padding:11px 15px;cursor:pointer}.party-summary::-webkit-details-marker{display:none}.party-name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.party-balance{font-weight:600;font-size:15px;white-space:nowrap}.party-totals{display:flex;gap:18px;flex-wrap:wrap;padding:0 15px 10px;font-size:11px;color:var(--muted)}.party-totals b{font-weight:500;margin-left:6px}.currency-tag{color:var(--muted);font-size:10px;font-weight:400;margin-left:7px}.metric{text-align:right}.metric label{display:none}.metric b{font-weight:500}.count{font-size:11px;color:var(--muted);text-align:right}.arrow{color:var(--muted);text-align:right}.party[open] .arrow{transform:rotate(90deg)}
.documents{padding:0 15px 10px}.doc{display:grid;grid-template-columns:minmax(180px,1.3fr) repeat(3,minmax(100px,1fr));gap:12px;padding:11px 0;border-top:1px solid var(--border);font-size:12px}.doc p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.6}.doc-value{text-align:right;padding-top:2px}.badge{font-size:10px;color:var(--blue);margin-left:5px}
.funds{margin-top:18px}.funds h2{font-size:14px;margin:0 0 6px}.funds>p{font-size:11px;color:var(--muted);line-height:1.6;margin:0 0 10px}.funds-head,.funds-row{display:grid;grid-template-columns:minmax(100px,1.3fr) 1fr 1fr;gap:10px;padding:11px 15px;font-size:12px}.funds-head{background:var(--surface2);color:var(--muted);font-size:11px}.funds-row{border-top:1px solid var(--border)}.funds-head span:not(:first-child),.funds-row span:not(:first-child){text-align:right}.future-note{font-size:11px;color:var(--muted);padding:0 15px 10px;line-height:1.6}.empty{padding:25px;text-align:center;color:var(--muted);font-size:12px}footer{color:var(--muted);font-size:11px;line-height:1.7;margin-top:13px}
@media(max-width:768px){main{padding:0 15px}.notice{font-size:10px;margin-bottom:12px}.explain{font-size:11px}.stats{gap:8px;margin-bottom:14px}.stat{padding:13px 12px}.stat label{font-size:11px}.stat b{font-size:21px}.stat small{font-size:10px}.summary-header{display:none}.party-summary{padding:11px 12px;gap:8px}.party-name{font-size:12px}.party-balance{font-size:14px}.party-totals{padding:0 12px 9px;gap:12px}.documents{padding:0 12px 8px}.doc{grid-template-columns:minmax(0,1fr) auto;gap:4px}.doc-id{grid-column:1 / 3}.doc-value{grid-column:2;font-size:11px}.doc-value::before{content:attr(data-label);color:var(--muted);margin-right:8px}.doc p{max-width:280px}.funds h2{font-size:13px}.funds-head,.funds-row{padding:10px 12px;gap:8px;font-size:11px}.currency-tag{margin-left:4px}}
</style>
</head><body><main>
<div class="notice">演示报表 · 以下均为虚构的发货及收付款情景，未接入正式账款，请勿用于对账</div>
<p id="explain" class="explain"></p>
<section class="stats" id="stats" aria-label="未结总额"></section>
<section class="summary-table"><div class="summary-header" id="head"></div><div id="groups"></div></section>
<section class="funds"><h2 id="funds-title"></h2><p id="funds-note"></p><div class="summary-table"><div class="funds-head" id="funds-head"></div><div id="funds"></div></div></section>
<footer>已结清项目不显示，记录保留。美元、人民币分别汇总，不混加；点击客户或供应商展开未结单据。</footer>
</main><script>
// 演示情景只保存在页面内存中，不读取或写入CRM数据。
var mode='ar';
var demo={ar:[{name:'示例客户A',currency:'USD',docs:[{no:'PI-DEMO-01',status:'已发货（演示）',note:'软木杯垫、冰箱贴 · 订单金额 $13,768.40',confirmed:13768.4,offset:5000}],pre:1500,unallocated:1500,future:'PI-DEMO-01 尚未发货：预收 $1,500，暂不计入发货应收。'},{name:'示例客户B',currency:'USD',docs:[{no:'PI-DEMO-01',status:'已发货（演示）',note:'示例订单 · 已结清',confirmed:4500,offset:4500}],pre:0,unallocated:0},{name:'华南礼品（演示）',currency:'CNY',docs:[{no:'PI-演示-003',status:'已发货',note:'示例人民币订单',confirmed:8000,offset:3000}],pre:0,unallocated:0}],ap:[{name:'软木制品厂（演示）',currency:'CNY',docs:[{no:'PO-演示-001',status:'部分发货',note:'采购总额 ¥15,000；已发货 ¥12,000，未发货 ¥3,000。',confirmed:12000,offset:4000}],pre:3000,unallocated:800,future:'另一笔未发货采购单已预付 ¥3,000，暂不抵扣本单应付。'},{name:'包装盒厂（演示）',currency:'CNY',docs:[{no:'PO-演示-002',status:'已到货',note:'发货时已确认应付；现已结清。',confirmed:2000,offset:2000}],pre:0,unallocated:0},{name:'海外配件商（演示）',currency:'USD',docs:[{no:'PO-演示-003',status:'已发货',note:'示例美元采购单',confirmed:2500,offset:1000}],pre:500,unallocated:0}]};
function cents(value){return Math.round((Number(value)||0)*100);}
function balanceCents(doc){return cents(doc.confirmed)-cents(doc.offset);}
function money(value,currency){return (currency==='USD'?'$':'¥')+Number(value).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function sum(docs,key){return docs.reduce(function(s,doc){return s+cents(doc[key]);},0)/100;}
function amountTone(currency){return mode==='ap'?'red':currency==='USD'?'green':'yellow';}
function setMode(next){mode=next==='ap'?'ap':'ar';render();}
function render(){
 var ar=mode==='ar',all=demo[mode];
 // 按单据未结余额筛选，展示时复制分组，不删除结清记录，也不跨单据抵扣。
 var list=all.map(function(group){return Object.assign({},group,{docs:group.docs.filter(function(doc){return balanceCents(doc)>0;})});}).filter(function(group){return group.docs.length>0;});
 var gross=ar?'发货应收':'发货应付',paid=ar?'已收抵扣':'已付抵扣',remaining=ar?'未收余额':'未付余额';
 document.getElementById('explain').textContent=ar?'我们发货后确认应收，以下仅显示尚未收齐的单据。':'供应商发货后确认应付，以下仅显示尚未付清的单据。';
 document.getElementById('stats').innerHTML=['USD','CNY'].map(function(currency){
  var groups=list.filter(function(group){return group.currency===currency;}),total=groups.reduce(function(s,group){return s+group.docs.reduce(function(n,doc){return n+balanceCents(doc);},0);},0)/100;
  return '<div class="stat" data-currency="'+currency+'"><label>'+(currency==='USD'?'美元':'人民币')+(ar?'应收':'应付')+' · '+currency+'</label><b class="'+amountTone(currency)+'">'+money(total,currency)+'</b><small>'+groups.length+(ar?' 位客户':' 家供应商')+'未结</small></div>';
 }).join('');
 document.getElementById('head').innerHTML=[ar?'客户 / 币种':'供应商 / 币种',remaining,''].map(function(text){return '<span>'+text+'</span>';}).join('');
 document.getElementById('groups').innerHTML=list.length?list.map(function(group){
  var total=sum(group.docs,'confirmed'),settled=sum(group.docs,'offset'),currency=group.currency;
  var tone=amountTone(currency);
  return '<details class="party"><summary class="party-summary"><span class="party-name" title="'+group.name+'">'+group.name+'<span class="currency-tag">'+currency+'</span></span><span class="party-balance '+tone+'">'+money((cents(total)-cents(settled))/100,currency)+'</span><span class="arrow">›</span></summary><div class="party-totals"><span>'+gross+'<b class="'+tone+'">'+money(total,currency)+'</b></span><span>'+paid+'<b class="'+tone+'">'+money(settled,currency)+'</b></span></div><div class="documents">'+group.docs.map(function(doc){return '<div class="doc"><div class="doc-id">'+doc.no+'<span class="badge">'+doc.status+'</span><p>'+doc.note+'</p></div><div class="doc-value '+tone+'" data-label="'+gross+'">'+money(doc.confirmed,currency)+'</div><div class="doc-value '+tone+'" data-label="'+paid+'">'+money(doc.offset,currency)+'</div><div class="doc-value '+tone+'" data-label="'+remaining+'">'+money(balanceCents(doc)/100,currency)+'</div></div>';}).join('')+'</div></details>';
 }).join(''):'<div class="empty">'+(ar?'暂无未结应收':'暂无未结应付')+'</div>';
 document.getElementById('funds-title').textContent=ar?'预收与未分配到账':'预付与未分配付款';
 document.getElementById('funds-note').textContent=ar?'单独列示，不自动抵扣其他订单。':'单独列示，不自动抵扣其他采购单。';
 document.getElementById('funds-head').innerHTML='<span>'+(ar?'客户 / 币种':'供应商 / 币种')+'</span><span>'+(ar?'未发货预收':'未发货预付')+'</span><span>'+(ar?'未分配到账':'未分配付款')+'</span>';
 // 资金列表使用全部分组；即使该客户已结清，预收和未分配款仍须保留。
 var funds=all.filter(function(group){return cents(group.pre)>0||cents(group.unallocated)>0;});
 document.getElementById('funds').innerHTML=funds.length?funds.map(function(group){return '<div class="funds-row"><span>'+group.name+'<span class="currency-tag">'+group.currency+'</span></span><span class="'+(ar?'red':'green')+'">'+money(group.pre,group.currency)+'</span><span class="'+amountTone(group.currency)+'">'+money(group.unallocated,group.currency)+'</span></div>'+(group.future?'<div class="future-note">'+group.future+'</div>':'');}).join(''):'<div class="empty">暂无预收／预付或未分配款项</div>';
}
// 只通知外层调整展示高度，不接收或访问CRM数据。
function notifyDemoHeight(){parent.postMessage({type:'customento-fin-demo-height',height:Math.ceil(document.body.getBoundingClientRect().height)},'*');}
setMode(location.hash==='#ap'?'ap':'ar');
new ResizeObserver(notifyDemoHeight).observe(document.body);
window.addEventListener('load',notifyDemoHeight);
</script></body></html>
