<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>应收应付汇总 · 界面预览</title><style>
:root{--bg:#0f1117;--surface:#191d29;--surface2:#222738;--border:#30364c;--text:#e4e7f1;--muted:#858ea8;--blue:#4f8ef7;--green:#3ecf8e;--red:#f06d79}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button{border:1px solid var(--border);background:transparent;border-radius:6px;padding:7px 13px}button.on{background:var(--blue);color:#fff;border-color:var(--blue)}aside{position:fixed;width:210px;inset:0 auto 0 0;background:var(--surface);border-right:1px solid var(--border);padding:30px 20px}aside h2{color:var(--blue);font-family:Georgia,serif;margin:0 0 8px}aside p{color:var(--muted);font-size:12px;margin-bottom:35px}aside div{padding:14px 12px;color:var(--muted)}aside .selected{background:#212b42;color:var(--blue);border-radius:5px}main{margin-left:210px;padding:28px;max-width:1520px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:26px;margin:0}.main-tabs{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}.main-tabs span{padding:8px 13px;color:var(--muted);font-size:12px}.main-tabs span:last-child{background:var(--blue);color:white}.notice{font-size:11px;color:#d8b477;margin-bottom:18px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.report-tabs{display:flex;gap:5px}.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 10px;outline:none}.toolbar input{width:190px}.currency{margin-left:auto}.explain{font-size:12px;color:var(--muted);margin:0 0 16px;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.stat{background:var(--surface2);border-radius:9px;padding:15px 17px}.stat label{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}.stat b{font-size:22px}.blue{color:var(--blue)}.green{color:var(--green)}.red{color:var(--red)}.summary-table{border:1px solid var(--border);border-radius:9px;background:var(--surface);overflow:hidden}.summary-header,.party-summary{display:grid;grid-template-columns:minmax(130px,1.3fr) repeat(3,minmax(110px,1fr)) 65px 18px;gap:14px;align-items:center}.summary-header{background:var(--surface2);padding:11px 15px;font-size:11px;color:var(--muted)}.summary-header span:not(:first-child){text-align:right}.party{border-bottom:1px solid var(--border)}.party:last-child{border-bottom:0}.party-summary{list-style:none;padding:16px 15px;cursor:pointer}.party-summary::-webkit-details-marker{display:none}.party-name{font-weight:600}.metric{text-align:right}.metric label{display:none}.metric b{font-weight:500}.count{font-size:11px;color:var(--muted);text-align:right}.arrow{color:var(--muted);text-align:right}.party[open] .arrow{transform:rotate(90deg)}.documents{padding:0 15px 12px}.doc{display:grid;grid-template-columns:minmax(180px,1.3fr) repeat(3,minmax(100px,1fr));gap:14px;padding:11px 0;border-top:1px solid var(--border);font-size:12px}.doc p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.6}.doc .doc-value{text-align:right;padding-top:2px}.badge{font-size:10px;color:var(--blue);margin-left:5px}.future-note{font-size:11px;color:var(--muted);padding:1px 0 6px;line-height:1.6}.funds{margin-top:20px}.funds h2{font-size:14px;margin:0 0 6px}.funds>p{font-size:11px;color:var(--muted);line-height:1.6;margin:0 0 10px}.funds-head,.funds-row{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px;padding:11px 15px;font-size:12px}.funds-head{background:var(--surface2);color:var(--muted);font-size:11px}.funds-row{border-top:1px solid var(--border)}.funds-head span:not(:first-child),.funds-row span:not(:first-child){text-align:right}.empty{padding:30px;text-align:center;color:var(--muted)}footer{color:var(--muted);font-size:11px;line-height:1.7;margin-top:14px}
@media(max-width:768px){aside{display:none}main{margin:0;padding:18px 15px}header{margin-bottom:16px}h1{font-size:20px}.main-tabs span{padding:6px 8px;font-size:10px}.main-tabs span:not(:last-child){display:none}.notice{font-size:10px;line-height:1.6;margin-bottom:12px}.toolbar{gap:8px}.toolbar button{padding:7px 10px;font-size:12px}.currency{margin-left:auto}.toolbar input{width:calc(100% - 115px);font-size:12px}.toolbar select{font-size:12px}.toolbar .status{width:107px}.explain{font-size:11px}.stats{gap:6px;margin-bottom:15px}.stat{padding:12px 9px}.stat label{font-size:10px;white-space:nowrap}.stat b{font-size:17px}.summary-header{display:none}.party-summary{grid-template-columns:minmax(0,1fr) auto 15px;gap:8px;padding:13px 12px}.party-name{grid-column:1;grid-row:1}.count{grid-column:2;grid-row:1}.arrow{grid-column:3;grid-row:1}.metric{grid-row:2;text-align:left;padding-top:7px}.metric label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.metric b{font-size:12px}.metric:nth-child(2){grid-column:1}.metric:nth-child(3){grid-column:2;text-align:right}.metric:nth-child(4){grid-column:1 / 4;grid-row:3;text-align:right;padding-top:0;margin-top:-1px}.metric:nth-child(4) label{display:inline;margin-right:6px}.metric:nth-child(4) b{font-size:16px;font-weight:600}.documents{padding:0 12px 9px}.doc{grid-template-columns:minmax(0,1fr) auto;gap:4px}.doc .doc-id{grid-column:1 / 3}.doc .doc-value{grid-column:2;font-size:11px}.doc .doc-value::before{content:attr(data-label);color:var(--muted);margin-right:8px}.doc .doc-value:first-of-type{grid-row:2}.doc p{max-width:280px}.funds{margin-top:16px}.funds-head,.funds-row{padding:10px 12px;gap:8px;font-size:11px}.funds h2{font-size:13px}}
main{margin:0;padding:0;max-width:none}.currency{margin-left:0}@media(max-width:768px){main{padding:0 15px}}
</style></head><body>

<main>
<div class="notice">演示报表 · 以下均为虚构的发货及收付款情景，未接入正式账款，请勿用于对账</div>
<div class="toolbar"><div class="report-tabs" style="display:none"><button id="tab-ar" onclick="setMode('ar')">应收汇总</button><button id="tab-ap" onclick="setMode('ap')">应付汇总</button></div><select id="currency" class="currency" aria-label="币种" onchange="render()"><option value="USD">USD 美元</option><option value="CNY">CNY 人民币</option></select><input id="search" aria-label="搜索客户或供应商" placeholder="搜索客户…" oninput="render()"><select id="status" class="status" aria-label="余额筛选" onchange="render()"><option value="all">全部往来</option><option value="unpaid">仅未结清</option></select></div>
<p id="explain" class="explain"></p><section class="stats" id="stats"></section><section class="summary-table"><div class="summary-header" id="head"></div><div id="groups"></div></section>
<section class="funds"><h2 id="funds-title"></h2><p id="funds-note"></p><div class="summary-table"><div class="funds-head" id="funds-head"></div><div id="funds"></div></div></section><footer>按币种分别统计。履约完成不清除欠款；分批发货只确认已发货部分。点击客户或供应商，可展开单据。</footer></main>
<script>
// 仅用于讨论版式的隔离示例，不读取或写入CRM存储。
var mode='ar';
var demo={ar:[{name:'GKK',currency:'USD',docs:[{no:'PI-20261028-01',status:'已发货（演示）',note:'软木杯垫、冰箱贴 · 订单金额 $13,768.40',confirmed:13768.4,offset:5000}],pre:1500,unallocated:1500,future:'PI-20261027-01 尚未发货：预收 $1,500，暂不计入发货应收。'},{name:'CAZL',currency:'USD',docs:[{no:'PI-20260510-01',status:'已发货（演示）',note:'示例订单 · 已结清',confirmed:4500,offset:4500}],pre:0,unallocated:0},{name:'华南礼品（演示）',currency:'CNY',docs:[{no:'PI-演示-003',status:'已发货',note:'示例人民币订单',confirmed:8000,offset:3000}],pre:0,unallocated:0}],ap:[{name:'软木制品厂（演示）',currency:'CNY',docs:[{no:'PO-演示-001',status:'部分发货',note:'采购总额 ¥15,000；已发货 ¥12,000，未发货 ¥3,000。',confirmed:12000,offset:4000}],pre:3000,unallocated:800,future:'另一笔未发货采购单已预付 ¥3,000，暂不抵扣本单应付。'},{name:'包装盒厂（演示）',currency:'CNY',docs:[{no:'PO-演示-002',status:'已到货',note:'发货时已确认应付；现已结清。',confirmed:2000,offset:2000}],pre:0,unallocated:0},{name:'海外配件商（演示）',currency:'USD',docs:[{no:'PO-演示-003',status:'已发货',note:'示例美元采购单',confirmed:2500,offset:1000}],pre:500,unallocated:0}]};
function money(v){return (document.getElementById('currency').value==='USD'?'$':'¥')+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function sum(docs,key){return docs.reduce(function(s,d){return s+Math.round(d[key]*100);},0)/100;}
function setMode(next){mode=next;document.getElementById('currency').value=mode==='ar'?'USD':'CNY';document.getElementById('search').value='';document.getElementById('status').value='all';render();}
function render(){
 var ar=mode==='ar',currency=document.getElementById('currency').value,q=document.getElementById('search').value.trim().toLowerCase(),unpaid=document.getElementById('status').value==='unpaid';
 document.getElementById('tab-ar').className=ar?'on':'';document.getElementById('tab-ap').className=ar?'':'on';document.getElementById('search').placeholder=ar?'搜索客户…':'搜索供应商…';
 var list=demo[mode].filter(function(g){return g.currency===currency&&g.name.toLowerCase().includes(q)&&(!unpaid||sum(g.docs,'confirmed')>sum(g.docs,'offset'));});
 var confirmed=list.reduce(function(s,g){return s+sum(g.docs,'confirmed');},0),offset=list.reduce(function(s,g){return s+sum(g.docs,'offset');},0),balance=confirmed-offset;
 var gross=ar?'发货应收':'发货应付',paid=ar?'已收抵扣':'已付抵扣',remaining=ar?'未收余额':'未付余额';
 document.getElementById('explain').textContent=ar?'我们发货后确认应收；只扣除已分配到对应单据的收款。':'供应商发货后确认应付；只扣除已分配到对应单据的付款。';
 document.getElementById('stats').innerHTML=[{name:gross,value:confirmed,color:'blue'},{name:paid,value:offset,color:'green'},{name:remaining,value:balance,color:'red'}].map(function(s){return '<div class="stat"><label>'+s.name+'</label><b class="'+s.color+'">'+money(s.value)+'</b></div>';}).join('');
 document.getElementById('head').innerHTML=[ar?'客户':'供应商',gross,paid,remaining,'单据',''].map(function(t){return '<span>'+t+'</span>';}).join('');
 document.getElementById('groups').innerHTML=list.length?list.map(function(g,i){var total=sum(g.docs,'confirmed'),settled=sum(g.docs,'offset');return '<details class="party"'+(i===0?' open':'')+'><summary class="party-summary"><span class="party-name">'+g.name+'</span><span class="metric"><label>'+gross+'</label><b>'+money(total)+'</b></span><span class="metric"><label>'+paid+'</label><b class="green">'+money(settled)+'</b></span><span class="metric"><label>'+remaining+'</label><b class="'+(total>settled?'red':'green')+'">'+money(total-settled)+'</b></span><span class="count">'+g.docs.length+' 单</span><span class="arrow">›</span></summary><div class="documents">'+g.docs.map(function(d){return '<div class="doc"><div class="doc-id">'+d.no+'<span class="badge">'+d.status+'</span><p>'+d.note+'</p></div><div class="doc-value" data-label="'+gross+'">'+money(d.confirmed)+'</div><div class="doc-value green" data-label="'+paid+'">'+money(d.offset)+'</div><div class="doc-value '+(d.confirmed>d.offset?'red':'green')+'" data-label="'+remaining+'">'+money(d.confirmed-d.offset)+'</div></div>';}).join('')+'</div></details>';}).join(''):'<div class="empty">没有符合条件的往来记录</div>';
 document.getElementById('funds-title').textContent=ar?'预收与未分配到账':'预付与未分配付款';document.getElementById('funds-note').textContent=ar?'未发货单据的预收款与尚未分配的到账分别列示，不自动抵扣其他订单。':'未发货采购单的预付款与尚未分配的付款分别列示，不按供应商同名自动抵扣。';
 document.getElementById('funds-head').innerHTML='<span>'+(ar?'客户':'供应商')+'</span><span>'+(ar?'未发货预收':'未发货预付')+'</span><span>'+(ar?'未分配到账':'未分配付款')+'</span>';
 var funds=list.filter(function(g){return g.pre||g.unallocated;});document.getElementById('funds').innerHTML=funds.length?funds.map(function(g){return '<div class="funds-row"><span>'+g.name+'</span><span class="blue">'+money(g.pre)+'</span><span>'+money(g.unallocated)+'</span></div>'+(g.future?'<div class="future-note" style="padding:0 15px 10px">'+g.future+'</div>':'');}).join(''):'<div class="empty">暂无预收／预付或未分配款项</div>';
}
// 只通知外层调整展示高度，不接收或访问CRM数据。
function notifyDemoHeight(){parent.postMessage({type:'customento-fin-demo-height',height:Math.ceil(document.body.getBoundingClientRect().height)},'*');}
setMode(location.hash==='#ap'?'ap':'ar');
new ResizeObserver(notifyDemoHeight).observe(document.body);
window.addEventListener('load',notifyDemoHeight);
</script></body></html>
